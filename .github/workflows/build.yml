# Run on push to the main branch or PR

name: Newlib-8266 CI


on:
  push:
  pull_request:


jobs:

  build:
    name: Build Newlib
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Toolchain
      run: |
        mkdir -p $HOME/toolchain
        pushd $HOME/toolchain
        wget https://github.com/earlephilhower/esp-quick-toolchain/releases/download/3.2.0-gcc10.3/x86_64-linux-gnu.xtensa-lx106-elf-c791b74.230224.tar.gz
        tar xf x86_64-linux-gnu.xtensa-lx106-elf-*.tar.gz
        popd
    - name: Build
      run: |
        export PATH=$HOME/toolchain/xtensa-lx106-elf/bin/:$PATH
        ./configure \
          CFLAGS_FOR_TARGET="-mlongcalls -Os -g -free -fipa-pta" \
          --target=xtensa-lx106-elf \
          --with-target-subdir=xtensa-lx106-elf \
          --prefix=$HOME/toolchain/ \
          --with-newlib \
          --with-libgloss \
          --enable-multilib \
          --disable-newlib-io-c99-formats \
          --disable-newlib-supplied-syscalls \
          --enable-newlib-nano-formatted-io \
          --enable-newlib-reent-small \
          --enable-target-optspace \
          --disable-option-checking \
          --disable-shared
        make -j$(nproc) all

    - name: Archive
      run: |
        export PATH=$HOME/toolchain/xtensa-lx106-elf/bin/:$PATH
        mkdir -p $HOME/archive
        make DESTDIR=$HOME/archive install
        pushd $HOME
        time zip \
          --quiet \
          --recurse-paths \
          newlib-${{ github.sha }}.zip archive/
        popd
        mv $HOME/newlib-${{ github.sha }}.zip ./

    - uses: actions/upload-artifact@v4
      with:
        name: newlib-${{ github.sha }}
        path: newlib-${{ github.sha }}.zip
